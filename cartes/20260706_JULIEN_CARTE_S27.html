      var DESKTOP = {
        btn:    { padding:'8px 14px',   fontSize:'13px', borderRadius:'6px' },
        panel:  { width:'560px', maxWidth:'none',
                   maxHeight:'85vh', padding:'12px 16px', borderRadius:'8px' },
        badgeStop:  { width:'20px', height:'20px', fontSize:'11px', marginRight:'8px' },
        badgeCompl: { width:'18px', height:'18px', fontSize:'11px', marginRight:'9px', marginLeft:'1px' },
        entry:  { margin:'4px 0', lineHeight:'1.6' },
        nom:    { fontSize:'13px' },
        ville:  { fontSize:'11px', marginLeft:'6px' },
        header: { fontSize:'15px', paddingBottom:'7px', marginBottom:'11px', borderBottomWidth:'2px' },
        tag:    { fontSize:'11px', marginBottom:'7px' },
        sep:    { borderTopWidth:'1px', margin:'6px 0 3px' },
        section:{ fontSize:'10px', marginBottom:'3px' },
        prioRow:{ display:'flex', alignItems:'center', gap:'7px', margin:'3px 0' },
        prioDot:{ display:'inline-block', width:'12px', height:'12px', borderRadius:'2px', flexShrink:'0' },
        prioLbl:{ fontSize:'12px' },
        prioTtl:{ fontSize:'10px', marginBottom:'4px' },
        divSep: { borderTopWidth:'1px', margin:'9px 0 5px' },
      };

      function applyAll() {
        var S = window.innerWidth <= 768 ? MOBILE : DESKTOP;
        var btn   = document.getElementById('leg-btn');
        var panel = document.getElementById('leg-panel');
        if (!btn || !panel) return;

        // Bouton
        Object.assign(btn.style, S.btn);

        // Panneau
        Object.assign(panel.style, S.panel);

        // Badges stops
        panel.querySelectorAll('.leg-badge-stop').forEach(function(el) {
          Object.assign(el.style, S.badgeStop);
        });

        // Badges complémentaires
        panel.querySelectorAll('.leg-badge-compl').forEach(function(el) {
          Object.assign(el.style, S.badgeCompl);
        });

        // Entrées
        panel.querySelectorAll('.leg-entry').forEach(function(el) {
          Object.assign(el.style, S.entry);
        });
        panel.querySelectorAll('.leg-nom').forEach(function(el) {
          Object.assign(el.style, S.nom);
        });
        panel.querySelectorAll('.leg-ville').forEach(function(el) {
          Object.assign(el.style, S.ville);
        });

        // En-tête
        var hdr = panel.querySelector('.leg-header');
        if (hdr) Object.assign(hdr.style, S.header);

        // Tag
        var tag = panel.querySelector('.leg-tag');
        if (tag) Object.assign(tag.style, S.tag);

        // Séparateurs
        panel.querySelectorAll('.leg-sep').forEach(function(el) {
          Object.assign(el.style, S.sep);
        });
        panel.querySelectorAll('.leg-section').forEach(function(el) {
          Object.assign(el.style, S.section);
        });

        // Priorité
        panel.querySelectorAll('.leg-prio-row').forEach(function(el) {
          Object.assign(el.style, S.prioRow);
        });
        panel.querySelectorAll('.leg-prio-dot').forEach(function(el) {
          Object.assign(el.style, S.prioDot);
        });
        panel.querySelectorAll('.leg-prio-label').forEach(function(el) {
          Object.assign(el.style, S.prioLbl);
        });
        var prioTtl = panel.querySelector('.leg-prio-title');
        if (prioTtl) {
          prioTtl.textContent = 'Priorité';
          Object.assign(prioTtl.style, S.prioTtl);
        }
        var divSep = panel.querySelector('.leg-div-sep');
        if (divSep) Object.assign(divSep.style, S.divSep);
      }

      // Appliquer au chargement et au resize
      window.addEventListener('load', applyAll);
      window.addEventListener('resize', applyAll);
      // Appliquer aussi quand le panneau s'ouvre
      document.addEventListener('click', function() {
        setTimeout(applyAll, 10);
      });
    })();
    </script>
